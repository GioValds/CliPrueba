  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        
    - name: 📦 Install dependencies
      run: flutter pub get
      
    - name: 🔧 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 📱 Create Android emulator
      run: |
        echo "y" | sdkmanager "platforms;android-31" "system-images;android-31;google_apis;x86_64"
        echo "no" | avdmanager create avd -n test -k "system-images;android-31;google_apis;x86_64" -d "Nexus 6"
      
    - name: 🚀 Start emulator
      run: |
        emulator -avd test -no-window -no-audio -no-snapshot -gpu swiftshader &
        adb wait-for-device
        sleep 30
        adb devices
        flutter devices
      
    - name: 🌐 Run integration tests
      run: |
        # Wait for emulator to be fully ready
        adb shell input keyevent 82
        sleep 10
        
        # Build and test with retry
        flutter test integration_test/app_test.dart --dart-define=CI=true || \
        (echo "First attempt failed, retrying..." && sleep 10 && flutter test integration_test/app_test.dart --dart-define=CI=true)
      timeout-minutes: 15